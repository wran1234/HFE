version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_LIVE_MODEL=${GEMINI_LIVE_MODEL:-gemini-3.1-flash-live-preview}
      - AUTH_SESSION_SECRET=${AUTH_SESSION_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-}
      - AUTH_MAINTENANCE_KEY=${AUTH_MAINTENANCE_KEY:-}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-console}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://localhost:5173}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - NODE_ENV=production
      - PORT=8080
    restart: unless-stopped

  # Dev-only: run frontend separately with hot reload
  client-dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./client:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_WS_URL=ws://localhost:8080
    profiles:
      - dev
